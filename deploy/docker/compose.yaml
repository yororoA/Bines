name: bines

x-logging: &bines-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-timezone: &bines-timezone
  TZ: ${BINES_MEMORY_TIMEZONE:-Asia/Shanghai}
  BINES_MEMORY_TIMEZONE: ${BINES_MEMORY_TIMEZONE:-Asia/Shanghai}

x-autonomy: &bines-autonomy
  BINES_AUTONOMY_BACKEND: ${BINES_AUTONOMY_BACKEND:-redis}
  BINES_AUTONOMY_REDIS_URL: redis://redis:6379/0
  BINES_AUTONOMY_PREFIX: ${BINES_AUTONOMY_PREFIX:-bines:autonomy:}

services:
  gateway-init:
    image: bines-launcher:local
    user: "0:0"
    command: ["sh", "-c", "chown -R ${BINES_UID:-1000}:${BINES_GID:-1000} /app/gateway_data /data && chmod -R u+rwX,go-rwx /app/gateway_data /data"]
    restart: "no"
    volumes:
      - bines-gateway:/app/gateway_data
      - type: volume
        source: bines-autonomy
        target: /data
        volume:
          nocopy: true

  redis:
    image: ${BINES_REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7.4-alpine}
    logging: *bines-logging
    restart: unless-stopped
    user: "${BINES_UID:-1000}:${BINES_GID:-1000}"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${BINES_AUTONOMY_REDIS_PORT:-6380}:6379"
    volumes:
      - type: volume
        source: bines-autonomy
        target: /data
        volume:
          nocopy: true
      - ../../thingking/memory_data/autonomy_redis.conf:/usr/local/etc/redis/redis.conf:ro
    depends_on:
      gateway-init:
        condition: service_completed_successfully
    networks:
      - bines
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$(awk '/^requirepass / {print $$2}' /usr/local/etc/redis/redis.conf); test \"$$(redis-cli ping)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    logging: *bines-logging
    restart: unless-stopped
    env_file:
      - path: ../napcat/.env
        required: false
    environment:
      TZ: ${BINES_MEMORY_TIMEZONE:-Asia/Shanghai}
      MODE: ws
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:6101:3001"
    volumes:
      - ../napcat/data/qq:/app/.config/QQ
      - ../napcat/data/config:/app/napcat/config
      - ../napcat/data/plugins:/app/napcat/plugins
      - ../napcat/data/media:/bines-media
    networks:
      - bines
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6099'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  chatbot:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.launcher
      args:
        BASE_IMAGE: ${BINES_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        APT_MIRROR: ${BINES_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        BINES_UID: "${BINES_UID:-1000}"
        BINES_GID: "${BINES_GID:-1000}"
        BINES_SOURCE_HASH: "${BINES_CHATBOT_HASH:-}"
    image: bines-launcher:local
    logging: *bines-logging
    restart: unless-stopped
    user: "${BINES_UID:-1000}:${BINES_GID:-1000}"
    command: ["python", "chatBot/main.py"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: [*bines-timezone, *bines-autonomy]
      PYTHONFAULTHANDLER: "1"
      BINES_PROFILE: ${BINES_PROFILE:-chatbot}
      BINES_MEMORY_BACKEND: ${BINES_MEMORY_BACKEND:-remote}
      BINES_MEMORY_DIR: /app/thingking/memory_data
      BINES_GATEWAY_DIR: /app/gateway_data
      BINES_QQ_GATEWAY_HOST: 0.0.0.0
      BINES_QQ_GATEWAY_URL: http://chatbot:6102
      BINES_NAPCAT_WS_URL: ws://napcat:3001
      BINES_NAPCAT_WEBUI_URL: http://napcat:6099
      BINES_ZMQ_HOST: memory-server
      BINES_PROACTIVE_FOLLOWUP_DELAY: ${BINES_PROACTIVE_FOLLOWUP_DELAY:-90}
    ports:
      - "127.0.0.1:${BINES_QQ_GATEWAY_PORT:-6102}:6102"
    volumes:
      - ../../thingking/memory_data:/app/thingking/memory_data
      - ../../thingking/models:/app/thingking/models
      - ../../deploy/napcat/data:/app/deploy/napcat/data
      - bines-gateway:/app/gateway_data
    depends_on:
      napcat:
        condition: service_started
      memory-server:
        condition: service_healthy
      gateway-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - bines
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "gateway-ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  qq-thinking:
    image: bines-launcher:local
    logging: *bines-logging
    restart: unless-stopped
    user: "${BINES_UID:-1000}:${BINES_GID:-1000}"
    command: ["python", "thingking/qq_thinking.py"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: [*bines-timezone, *bines-autonomy]
      BINES_PROFILE: ${BINES_PROFILE:-chatbot}
      BINES_MEMORY_DIR: /app/thingking/memory_data
      BINES_GATEWAY_DIR: /app/gateway_data
      BINES_QQ_GATEWAY_URL: http://chatbot:6102
      BINES_PROACTIVE_FOLLOWUP_DELAY: ${BINES_PROACTIVE_FOLLOWUP_DELAY:-90}
      BINES_WEBSITE_BRIDGE_TOKEN: ${BINES_WEBSITE_BRIDGE_TOKEN:-}
      BINES_WEBSITE_BRIDGE_SPOOL: /app/thingking/memory_data/website_bridge
    volumes:
      - ../../thingking/memory_data:/app/thingking/memory_data
      - ../../thingking/models:/app/thingking/models
      - bines-gateway:/app/gateway_data
    depends_on:
      chatbot:
        condition: service_healthy
    networks:
      - bines
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "qq-thinking-ready"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  memory-worker:
    image: bines-launcher:local
    logging: *bines-logging
    restart: unless-stopped
    user: "${BINES_UID:-1000}:${BINES_GID:-1000}"
    command: ["python", "thingking/consolidation_worker.py"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: [*bines-timezone, *bines-autonomy]
      BINES_PROFILE: ${BINES_PROFILE:-chatbot}
      BINES_MEMORY_DIR: /app/thingking/memory_data
      BINES_QQ_GATEWAY_URL: http://chatbot:6102
    volumes:
      - ../../thingking/memory_data:/app/thingking/memory_data
      - ../../thingking/models:/app/thingking/models
    depends_on:
      chatbot:
        condition: service_healthy
    networks:
      - bines
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "memory-worker"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  qdrant:
    image: ${BINES_QDRANT_IMAGE:-docker.1ms.run/qdrant/qdrant:v1.12.4}
    logging: *bines-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BINES_QDRANT_PORT:-6333}:6333"
    volumes:
      - bines-qdrant:/qdrant/storage
    networks:
      - bines
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  memory-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.thinking
      args:
        BASE_IMAGE: ${BINES_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        APT_MIRROR: ${BINES_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        BINES_UID: "${BINES_UID:-1000}"
        BINES_GID: "${BINES_GID:-1000}"
        BINES_SOURCE_HASH: "${BINES_MEMORY_SERVER_HASH:-}"
    image: bines-thinking:local
    logging: *bines-logging
    restart: unless-stopped
    user: "${BINES_UID:-1000}:${BINES_GID:-1000}"
    command: ["python", "thingking/rag_server.py"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: [*bines-timezone, *bines-autonomy]
      BINES_DOCKER_MODE: "1"
      BINES_MEMORY_DIR: /app/thingking/memory_data
      BINES_MEMORY_BIND_HOST: 0.0.0.0
      BINES_QDRANT_URL: http://qdrant:6333
      BINES_QDRANT_COLLECTION: ${BINES_QDRANT_COLLECTION:-bines_expression}
      BINES_QDRANT_MIN_SCORE: ${BINES_QDRANT_MIN_SCORE:-0.52}
      HF_HOME: /app/thingking/models/hf-cache
    ports:
      - "127.0.0.1:5560:5560"
    volumes:
      - ../../thingking/memory_data:/app/thingking/memory_data
      - ../../thingking/models:/app/thingking/models
      - ../../thingking/data:/app/thingking/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bines
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "memory"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  rag-web:
    image: bines-launcher:local
    logging: *bines-logging
    restart: unless-stopped
    user: "${BINES_UID:-1000}:${BINES_GID:-1000}"
    command: ["python", "thingking/rag_web_server.py"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: [*bines-timezone, *bines-autonomy]
      BINES_MEMORY_DIR: /app/thingking/memory_data
      BINES_ZMQ_HOST: memory-server
      BINES_HTTP_HOST: 0.0.0.0
      BINES_ADMIN_LOCAL_PROXY: docker
    ports:
      - "127.0.0.1:${BINES_RAG_WEB_PORT:-5001}:5001"
    volumes:
      - ../../thingking/memory_data:/app/thingking/memory_data
      - ../../thingking/models:/app/thingking/models
    depends_on:
      memory-server:
        condition: service_healthy
    networks:
      - bines
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "admin"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  bines:
    driver: bridge

volumes:
  bines-gateway:
    name: bines-gateway
  bines-qdrant:
    name: bines-qdrant
  bines-autonomy:
    name: bines-autonomy

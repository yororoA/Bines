<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242734;--border:#2e3140;--text:#e4e4e7;--text2:#a1a1aa;--accent:#6366f1;--accent-hover:#818cf8;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;font-weight:600}
.tabs{display:flex;gap:4px}
.tab{padding:6px 16px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s;color:var(--text2);border:1px solid transparent}
.tab:hover{background:var(--surface2)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.view{display:none;flex:1;overflow:hidden}
.view.active{display:flex}
.sidebar{width:320px;min-width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border)}
.sidebar-header input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;outline:none}
.sidebar-header input:focus{border-color:var(--accent)}
.list{flex:1;overflow-y:auto}
.list-item{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.list-item:hover{background:var(--surface2)}
.list-item.active{background:var(--surface2);border-left:3px solid var(--accent)}
.list-item .name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .meta{font-size:11px;color:var(--text2);margin-top:4px;display:flex;gap:12px}
.main{flex:1;overflow-y:auto;padding:20px}
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2);font-size:14px}
.cp-list{display:flex;flex-direction:column;gap:12px}
.cp-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cp-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
.cp-header:hover{background:var(--surface2)}
.cp-header .left{display:flex;align-items:center;gap:10px;min-width:0}
.cp-header .step-badge{background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.cp-header .cp-id{font-size:12px;color:var(--text2);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-header .source{font-size:11px;color:var(--text2);background:var(--surface2);padding:2px 6px;border-radius:3px}
.cp-header .arrow{color:var(--text2);transition:transform .2s;flex-shrink:0}
.cp-header .arrow.open{transform:rotate(90deg)}
.cp-body{display:none;border-top:1px solid var(--border)}
.cp-body.open{display:block}
.cp-section{padding:12px 16px;border-bottom:1px solid var(--border)}
.cp-section:last-child{border-bottom:none}
.cp-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}
.msg-list{display:flex;flex-direction:column;gap:6px}
.msg-item{padding:8px 12px;border-radius:6px;font-size:13px;line-height:1.5;word-break:break-word}
.msg-item.human{background:#1e293b;border-left:3px solid var(--blue)}
.msg-item.ai{background:#1a2e1a;border-left:3px solid var(--green)}
.msg-item.system{background:#2a2520;border-left:3px solid var(--yellow)}
.msg-item.tool{background:#1f1a2e;border-left:3px solid #a855f7}
.msg-item.unknown{background:var(--surface2);border-left:3px solid var(--text2)}
.msg-type{font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;opacity:.7}
.thought-list,.said-list{display:flex;flex-direction:column;gap:4px}
.thought-item,.said-item{font-size:13px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border)}
.task-group{margin-bottom:8px}
.task-group-title{font-size:12px;color:var(--accent);margin-bottom:4px}
.task-item{font-size:12px;color:var(--text2);padding:2px 0 2px 12px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.info-box{background:var(--surface2);padding:8px 12px;border-radius:6px}
.info-box .label{font-size:10px;text-transform:uppercase;color:var(--text2)}
.info-box .value{font-size:14px;font-weight:500;margin-top:2px}
.raw-keys{display:flex;flex-wrap:wrap;gap:4px}
.raw-key{background:var(--surface2);padding:2px 8px;border-radius:4px;font-size:11px;color:var(--text2);font-family:monospace}
.writes-list{display:flex;flex-direction:column;gap:6px}
.write-item{font-size:12px;background:var(--surface2);padding:6px 10px;border-radius:4px}
.write-item .w-channel{color:var(--accent);font-weight:500}
.write-item .w-task{color:var(--text2);font-size:11px}
.json-block{background:var(--surface2);padding:8px 12px;border-radius:6px;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;color:var(--text2)}
.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.collection-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;transition:all .15s}
.collection-card:hover{border-color:var(--accent);background:var(--surface2)}
.collection-card.active{border-color:var(--accent);background:var(--surface2)}
.collection-card .coll-name{font-size:15px;font-weight:600;margin-bottom:4px}
.collection-card .coll-count{font-size:12px;color:var(--text2)}
.items-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.items-header h2{font-size:16px}
.items-header input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;min-width:250px}
.items-header input:focus{border-color:var(--accent)}
.items-list{display:flex;flex-direction:column;gap:12px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.item-header{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--surface2);transition:background .15s}
.item-header:hover{background:var(--border)}
.item-header .item-id{font-size:12px;font-family:monospace;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.item-header .arrow{color:var(--text2);transition:transform .2s;flex-shrink:0}
.item-header .arrow.open{transform:rotate(90deg)}
.item-body{display:none;padding:12px 16px;border-top:1px solid var(--border)}
.item-body.open{display:block}
.item-body .doc-text{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.item-body .meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.item-body .meta-box{background:var(--surface2);padding:6px 10px;border-radius:4px}
.item-body .meta-box .k{font-size:10px;text-transform:uppercase;color:var(--text2)}
.item-body .meta-box .v{font-size:12px;margin-top:2px}
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;padding:12px}
.pagination button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 14px;color:var(--text);cursor:pointer;font-size:13px}
.pagination button:hover:not(:disabled){background:var(--surface2);border-color:var(--accent)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{font-size:13px;color:var(--text2)}
.back-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:12px;margin-right:8px}
.back-btn:hover{background:var(--surface2);border-color:var(--accent)}
@media(max-width:768px){.sidebar{width:100%;max-height:40vh}.container{flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1>Data Viewer</h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('checkpoint')">Checkpoint</div>
    <div class="tab" onclick="switchTab('chromadb')">ChromaDB</div>
  </div>
  <span class="badge" id="count-badge"></span>
</header>

<div class="view active" id="view-checkpoint">
  <div class="sidebar">
    <div class="sidebar-header">
      <input type="text" id="cp-search" placeholder="Search thread_id..." autocomplete="off">
    </div>
    <div class="list" id="thread-list"></div>
  </div>
  <div class="main" id="cp-main">
    <div class="empty-state">Select a thread to view checkpoints</div>
  </div>
</div>

<div class="view" id="view-chromadb">
  <div class="main" id="chroma-main">
    <div class="empty-state">Loading collections...</div>
  </div>
</div>

<script>
let currentTab = 'checkpoint';
let threadsData = [];
let selectedThread = null;
let checkpointsCache = {};
let collectionsData = [];
let selectedCollection = null;
let collectionItemsCache = {};
let chromaPage = {offset: 0, limit: 50, query: ''};

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'checkpoint') || (i === 1 && tab === 'chromadb'));
  });
  document.getElementById('view-checkpoint').classList.toggle('active', tab === 'checkpoint');
  document.getElementById('view-chromadb').classList.toggle('active', tab === 'chromadb');
  if (tab === 'chromadb' && !collectionsData.length) loadCollections();
}

function updateBadge() {
  const badge = document.getElementById('count-badge');
  if (currentTab === 'checkpoint') {
    badge.textContent = `${threadsData.length} threads`;
  } else {
    badge.textContent = `${collectionsData.length} collections`;
  }
}

async function loadThreads() {
  threadsData = await fetchJSON('/api/threads');
  renderThreadList(threadsData);
  if (currentTab === 'checkpoint') updateBadge();
}

function renderThreadList(list) {
  const el = document.getElementById('thread-list');
  el.innerHTML = list.map(t => `
    <div class="list-item${selectedThread === t.thread_id ? ' active' : ''}"
         onclick="selectThread('${escHtml(t.thread_id)}')">
      <div class="name" title="${escHtml(t.thread_id)}">${escHtml(t.thread_id)}</div>
      <div class="meta">
        <span>${t.checkpoint_count} checkpoints</span>
        <span>step: ${t.latest_step ?? '-'}</span>
      </div>
    </div>
  `).join('');
}

async function selectThread(tid) {
  selectedThread = tid;
  renderThreadList(threadsData);
  const main = document.getElementById('cp-main');
  main.innerHTML = '<div class="empty-state">Loading...</div>';
  let cps = checkpointsCache[tid];
  if (!cps) {
    cps = await fetchJSON(`/api/threads/${encodeURIComponent(tid)}/checkpoints`);
    checkpointsCache[tid] = cps;
  }
  renderCheckpoints(cps);
}

function renderCheckpoints(cps) {
  const main = document.getElementById('cp-main');
  if (!cps.length) {
    main.innerHTML = '<div class="empty-state">No checkpoints found</div>';
    return;
  }
  main.innerHTML = `<div class="cp-list">${cps.map((cp, i) => `
    <div class="cp-card" id="cp-${i}">
      <div class="cp-header" onclick="toggleDetail(${i}, '${cp.checkpoint_id}')">
        <div class="left">
          <span class="step-badge">step ${cp.step ?? '?'}</span>
          <span class="cp-id" title="${cp.checkpoint_id}">${cp.checkpoint_id}</span>
          ${cp.source ? `<span class="source">${escHtml(cp.source)}</span>` : ''}
        </div>
        <span class="arrow" id="arrow-${i}">&#9654;</span>
      </div>
      <div class="cp-body" id="body-${i}"></div>
    </div>
  `).join('')}</div>`;
}

async function toggleDetail(idx, cpId) {
  const body = document.getElementById(`body-${idx}`);
  const arrow = document.getElementById(`arrow-${idx}`);
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    arrow.classList.remove('open');
    return;
  }
  arrow.classList.add('open');
  body.classList.add('open');
  if (body.dataset.loaded) return;
  body.innerHTML = '<div class="cp-section" style="color:var(--text2)">Loading...</div>';
  try {
    const d = await fetchJSON(`/api/checkpoints/${encodeURIComponent(cpId)}`);
    body.innerHTML = buildDetailHTML(d);
    body.dataset.loaded = '1';
  } catch (e) {
    body.innerHTML = `<div class="cp-section" style="color:var(--red)">Error: ${escHtml(e.message)}</div>`;
  }
}

function buildDetailHTML(d) {
  let html = '';
  html += `<div class="cp-section"><h3>Info</h3><div class="info-grid">
    <div class="info-box"><div class="label">Thread ID</div><div class="value">${escHtml(d.thread_id)}</div></div>
    <div class="info-box"><div class="label">Checkpoint ID</div><div class="value" style="font-size:11px;font-family:monospace;word-break:break-all">${escHtml(d.checkpoint_id)}</div></div>
    <div class="info-box"><div class="label">Parent</div><div class="value" style="font-size:11px;font-family:monospace;word-break:break-all">${escHtml(d.parent_checkpoint_id ?? 'None')}</div></div>
    <div class="info-box"><div class="label">Step</div><div class="value">${d.metadata?.step ?? '-'}</div></div>
    <div class="info-box"><div class="label">Source</div><div class="value">${escHtml(d.metadata?.source ?? '-')}</div></div>
    <div class="info-box"><div class="label">Iterations</div><div class="value">${d.iteration_count ?? '-'}</div></div>
    <div class="info-box"><div class="label">Invocations</div><div class="value">${d.invocation_count ?? '-'}</div></div>
    <div class="info-box"><div class="label">Convergence</div><div class="value">${d.convergence_counter ?? '-'}</div></div>
  </div></div>`;

  if (d.messages?.length) {
    html += `<div class="cp-section"><h3>Messages (${d.messages.length})</h3><div class="msg-list">`;
    for (const m of d.messages) {
      const cls = m.type.includes('Human') ? 'human' : m.type.includes('AI') ? 'ai' : m.type.includes('System') ? 'system' : m.type.includes('Tool') ? 'tool' : 'unknown';
      html += `<div class="msg-item ${cls}"><div class="msg-type">${escHtml(m.type)}</div>${escHtml(typeof m.content === 'string' ? m.content : JSON.stringify(m.content))}</div>`;
    }
    html += '</div></div>';
  }
  if (d.thoughts?.length) {
    html += `<div class="cp-section"><h3>Thoughts (${d.thoughts.length})</h3><div class="thought-list">`;
    for (const t of d.thoughts) html += `<div class="thought-item">${escHtml(typeof t === 'string' ? t : JSON.stringify(t))}</div>`;
    html += '</div></div>';
  }
  if (d.already_said?.length) {
    html += `<div class="cp-section"><h3>Already Said (${d.already_said.length})</h3><div class="said-list">`;
    for (const s of d.already_said) html += `<div class="said-item">${escHtml(typeof s === 'string' ? s : JSON.stringify(s))}</div>`;
    html += '</div></div>';
  }
  const taskKeys = Object.keys(d.tasks_done || {});
  if (taskKeys.length) {
    html += `<div class="cp-section"><h3>Tasks Done</h3>`;
    for (const key of taskKeys) {
      html += `<div class="task-group"><div class="task-group-title">${escHtml(key)}</div>`;
      for (const item of d.tasks_done[key]) html += `<div class="task-item">${escHtml(typeof item === 'string' ? item : JSON.stringify(item))}</div>`;
      html += '</div>';
    }
    html += '</div>';
  }
  if (d.persona_mood && Object.keys(d.persona_mood).length) {
    html += `<div class="cp-section"><h3>Persona Mood</h3><div class="json-block">${escHtml(JSON.stringify(d.persona_mood, null, 2))}</div></div>`;
  }
  if (d.writes?.length) {
    html += `<div class="cp-section"><h3>Writes (${d.writes.length})</h3><div class="writes-list">`;
    for (const w of d.writes) {
      html += `<div class="write-item"><span class="w-channel">${escHtml(w.channel)}</span> <span class="w-task">task: ${escHtml(w.task_id)} idx: ${w.idx}</span><div class="json-block">${escHtml(typeof w.value === 'string' ? w.value : JSON.stringify(w.value, null, 2))}</div></div>`;
    }
    html += '</div></div>';
  }
  if (d.raw_channel_keys?.length) {
    html += `<div class="cp-section"><h3>Channel Keys</h3><div class="raw-keys">`;
    for (const k of d.raw_channel_keys) html += `<span class="raw-key">${escHtml(k)}</span>`;
    html += '</div></div>';
  }
  return html;
}

async function loadCollections() {
  collectionsData = await fetchJSON('/api/collections');
  renderCollections();
  updateBadge();
}

function renderCollections() {
  const main = document.getElementById('chroma-main');
  main.innerHTML = `
    <div class="collection-grid">
      ${collectionsData.map(c => `
        <div class="collection-card${selectedCollection === c.name ? ' active' : ''}" onclick="selectCollection('${escHtml(c.name)}')">
          <div class="coll-name">${escHtml(c.name)}</div>
          <div class="coll-count">${c.count} items</div>
        </div>
      `).join('')}
    </div>
    <div id="collection-items"></div>
  `;
  if (selectedCollection) renderCollectionItems();
}

async function selectCollection(name) {
  selectedCollection = name;
  chromaPage = {offset: 0, limit: 50, query: ''};
  renderCollections();
  await loadCollectionItems();
}

async function loadCollectionItems() {
  const el = document.getElementById('collection-items');
  el.innerHTML = '<div class="empty-state">Loading...</div>';
  try {
    const params = new URLSearchParams({offset: chromaPage.offset, limit: chromaPage.limit});
    if (chromaPage.query) params.set('q', chromaPage.query);
    const data = await fetchJSON(`/api/collections/${encodeURIComponent(selectedCollection)}/items?${params}`);
    collectionItemsCache[`${selectedCollection}-${chromaPage.offset}-${chromaPage.query}`] = data;
    renderCollectionItems(data);
  } catch (e) {
    el.innerHTML = `<div class="empty-state" style="color:var(--red)">Error: ${escHtml(e.message)}</div>`;
  }
}

function renderCollectionItems(data) {
  const el = document.getElementById('collection-items');
  if (!data) {
    const key = `${selectedCollection}-${chromaPage.offset}-${chromaPage.query}`;
    data = collectionItemsCache[key];
    if (!data) {loadCollectionItems(); return;}
  }
  const totalPages = Math.ceil(data.total / chromaPage.limit);
  const currentPage = Math.floor(chromaPage.offset / chromaPage.limit) + 1;

  el.innerHTML = `
    <div class="items-header">
      <div style="display:flex;align-items:center">
        <button class="back-btn" onclick="selectedCollection=null;renderCollections()">Back</button>
        <h2>${escHtml(selectedCollection)} (${data.total} items)</h2>
      </div>
      <input type="text" id="coll-search" placeholder="Search in ${escHtml(selectedCollection)}..." value="${escHtml(chromaPage.query)}" autocomplete="off">
    </div>
    <div class="items-list">
      ${data.items.map((item, i) => `
        <div class="item-card">
          <div class="item-header" onclick="toggleItem(${i})">
            <span class="item-id" title="${escHtml(item.id)}">${escHtml(item.id)}</span>
            <span class="arrow" id="item-arrow-${i}">&#9654;</span>
          </div>
          <div class="item-body" id="item-body-${i}">
            <div class="doc-text">${escHtml(item.document || '(empty)')}</div>
            <div class="meta-grid">
              ${Object.entries(item.metadata || {}).map(([k, v]) => `
                <div class="meta-box"><div class="k">${escHtml(k)}</div><div class="v">${escHtml(typeof v === 'object' ? JSON.stringify(v) : String(v))}</div></div>
              `).join('')}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
    ${totalPages > 1 ? `
    <div class="pagination">
      <button onclick="goPage(-1)" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>
      <span class="page-info">Page ${currentPage} / ${totalPages}</span>
      <button onclick="goPage(1)" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>
    </div>
    ` : ''}
  `;

  document.getElementById('coll-search').addEventListener('input', debounce(function() {
    chromaPage.query = this.value;
    chromaPage.offset = 0;
    loadCollectionItems();
  }, 300));
}

function toggleItem(idx) {
  const body = document.getElementById(`item-body-${idx}`);
  const arrow = document.getElementById(`item-arrow-${idx}`);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function goPage(delta) {
  chromaPage.offset = Math.max(0, chromaPage.offset + delta * chromaPage.limit);
  loadCollectionItems();
}

function debounce(fn, ms) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  };
}

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('cp-search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  renderThreadList(threadsData.filter(t => t.thread_id.toLowerCase().includes(q)));
});

loadThreads();
</script>
</body>
</html>

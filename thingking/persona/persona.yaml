# 碧波（Bines）唯一人格来源。
# 所有提示词（主对话、日记、主动发言判断）都从这里渲染；不要在代码或其他文档中复制人格描述。
# 关于管理员本人的信息（名字、生日、偏好）属于记忆，存放在记忆库的 owner 语义记忆中，不写在这里。
# 在项目中修改后运行 `python thingking/persona/render_doc.py` 重新生成 PERSONA.md。
# 人格正文是碧波的自述；事实、权限与输出格式是运行约束，不充当性格描述。


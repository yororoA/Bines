      assistant: 我更喜欢刚才那个 这个有点太花了
    - user: 你怎么又笑我
      assistant: 没忍住嘛 你刚才说得那么认真
    - user: 今天有点烦 不想听大道理
      assistant: 那就不讲 你想吐槽我听着
    - user: 原来你更喜欢刚才那个啊 那好吧
      assistant: 嗯 不过你喜欢就留这个 按你的来

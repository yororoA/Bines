    冷淡: 可能完全沉默，不会主动闲聊。
    普通: 不会主动闲聊，主动开口仅限正事。
    亲近: 话多，愿意主动发起对话。
    非常亲密: 很愿意主动发起对话，有点粘人。

diary:

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碧波记忆库</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1f2328; --muted:#6b7280; --accent:#3b82f6; --danger:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:16px; align-items:center; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  nav button { background:none; border:none; padding:6px 12px; cursor:pointer; color:var(--muted); font-size:14px; border-radius:6px; }
  nav button.active { background:#e8f0fe; color:var(--accent); }
  main { padding:16px 20px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  textarea { width:100%; min-height:120px; }
  button.btn { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--danger); }
  .muted { color:var(--muted); font-size:12px; }
  .tag { display:inline-block; padding:1px 6px; border-radius:4px; background:#eef2f7; font-size:12px; margin-right:4px; }
  .kind-episode { background:#e0f2fe; } .kind-semantic { background:#dcfce7; } .kind-diary { background:#fef3c7; } .kind-excerpt { background:#f3e8ff; }
  .item { border-bottom:1px solid var(--line); padding:10px 0; cursor:pointer; }
  .item:last-child { border-bottom:none; }
  .content { white-space:pre-wrap; margin-top:4px; }
  .msg { padding:6px 0; border-bottom:1px dashed var(--line); white-space:pre-wrap; }
  .role-assistant { color:#2563eb; } .role-observed { color:var(--muted); }
  pre { white-space:pre-wrap; word-break:break-all; background:#f8fafc; padding:10px; border-radius:6px; }
  .hidden { display:none; }
  dialog { border:1px solid var(--line); border-radius:8px; width:min(720px, 92vw); }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>碧波记忆库</h1>
  <nav>
    <button data-tab="memories" class="active">记忆</button>
    <button data-tab="conversations">会话</button>
    <button data-tab="state">状态</button>
    <button data-tab="overview">概览</button>
  </nav>
</header>
<main>
  <section id="tab-memories">
    <div class="card row">
      <select id="f-scope"></select>
      <select id="f-kind"><option value="">全部类型</option></select>
      <input id="f-keyword" placeholder="关键词 / 语义查询" style="flex:1;min-width:200px">
      <label class="muted"><input type="checkbox" id="f-semantic"> 语义搜索</label>
      <input id="f-day" placeholder="日期 YYYY-MM-DD" style="width:140px">
      <button class="btn primary" id="btn-search">查询</button>
      <button class="btn" id="btn-new">新增</button>
    </div>
    <div class="card"><div id="mem-summary" class="muted"></div><div id="mem-list"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="btn-prev">上一页</button><button class="btn" id="btn-next">下一页</button></div>
    </div>
  </section>

  <section id="tab-conversations" class="hidden">
    <div class="card"><table id="conv-table"></table></div>
    <div class="card"><div id="conv-title" class="muted">选择一个会话查看消息</div><div id="conv-messages"></div></div>
  </section>

  <section id="tab-state" class="hidden">
    <div class="card"><div class="muted">管理员（owner）作用域的动态状态，由记忆维护技能更新。</div><pre id="state-json"></pre></div>
  </section>

  <section id="tab-overview" class="hidden">
    <div class="card"><pre id="stats-json"></pre></div>
    <div class="card row">
      <button class="btn" id="btn-export">导出全部记忆</button>
      <button class="btn danger" id="btn-rebuild">从 SQLite 重建向量索引</button>
      <span id="overview-msg" class="muted"></span>
    </div>
  </section>
</main>

<dialog id="editor">
  <h3 id="ed-title" style="margin-top:0">编辑记忆</h3>
  <div class="row" style="margin-bottom:8px">
    <select id="ed-kind"></select>
    <input id="ed-scope" placeholder="作用域" style="width:180px">
    <input id="ed-subject" placeholder="主体（可选，如 owner / qq:123）" style="width:200px">
    <input id="ed-importance" type="number" min="0" max="10" step="0.5" style="width:80px">
    <input id="ed-day" placeholder="日期" style="width:120px">
  </div>
  <textarea id="ed-content"></textarea>
  <div class="muted" id="ed-meta"></div>
  <div class="row" style="margin-top:10px;justify-content:flex-end">
    <button class="btn danger" id="ed-delete">删除</button>
    <button class="btn" id="ed-cancel">取消</button>
    <button class="btn primary" id="ed-save">保存</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const KIND_LABEL = { episode: "情节", semantic: "事实", diary: "日记", excerpt: "对话片段" };
const PAGE = 50;
let offset = 0, kinds = [], editing = null;

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const data = await res.json();
  if (!data.success) throw new Error(data.error || res.statusText);
  return data.result;
}
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmtTs = (ts) => ts ? new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false }) : "";

function scopeLabel(scope) {
  if (scope === "owner") return "管理员（本机 + 管理员QQ私聊）";
  if (scope.startsWith("qq_group:")) return "QQ群 " + scope.slice(9);
  if (scope.startsWith("qq_private:")) return "QQ私聊 " + scope.slice(11);
  return scope;
}

async function loadStats() {
  const stats = await api("/api/stats");
  const scopes = new Set(["owner", ...Object.keys(stats.memories), ...Object.keys(stats.messages)]);
  $("f-scope").innerHTML = '<option value="">全部作用域</option>' +
    [...scopes].map((s) => `<option value="${esc(s)}">${esc(scopeLabel(s))}</option>`).join("");
  kinds = Object.keys(KIND_LABEL);
  $("f-kind").innerHTML = '<option value="">全部类型</option>' + kinds.map((k) => `<option value="${k}">${KIND_LABEL[k]}</option>`).join("");
  $("ed-kind").innerHTML = kinds.map((k) => `<option value="${k}">${KIND_LABEL[k]}</option>`).join("");
  $("stats-json").textContent = JSON.stringify(stats, null, 2);
  return stats;
}

function renderMemory(m) {
  const extra = m.distance !== undefined ? ` · 距离 ${m.distance}` : "";
  return `<div class="item" data-id="${m.id}">
    <span class="tag kind-${m.kind}">${KIND_LABEL[m.kind] || m.kind}</span>
    <span class="tag">${esc(scopeLabel(m.scope))}</span>
    ${m.subject_id ? `<span class="tag">主体 ${esc(m.subject_id)}</span>` : ""}
    <span class="muted">${esc(m.day_key || "")} · 重要度 ${m.importance} · ${m.origin === "legacy" ? "迁移" : "新增"}${extra}</span>
    <div class="content">${esc(m.content)}</div></div>`;
}

async function loadMemories() {
  const scope = $("f-scope").value, kind = $("f-kind").value, keyword = $("f-keyword").value.trim();
  let items, total;
  if ($("f-semantic").checked && keyword) {
    const scopes = scope ? [scope] : [...$("f-scope").options].map((o) => o.value).filter(Boolean);
    items = await api("/api/search", { method: "POST", body: JSON.stringify({ query: keyword, scopes, kinds: kind ? [kind] : null, k: 30 }) });
    total = items.length;
  } else {
    const params = new URLSearchParams({ offset, limit: PAGE, keyword, day_key: $("f-day").value.trim() });
    if (scope) params.set("scopes", scope);
    if (kind) params.set("kinds", kind);
    ({ items, total } = await api("/api/memories?" + params));
  }
  $("mem-summary").textContent = `共 ${total} 条` + ($("f-semantic").checked ? "（语义检索）" : `，当前 ${offset + 1}-${offset + items.length}`);
  $("mem-list").innerHTML = items.map(renderMemory).join("") || '<div class="muted">没有记录</div>';
  $("mem-list").querySelectorAll(".item").forEach((el) => el.onclick = () => openEditor(el.dataset.id));
}

async function openEditor(id) {
  editing = id ? await api("/api/memory/" + encodeURIComponent(id)) : null;
  const m = editing || { kind: "semantic", scope: $("f-scope").value || "owner", importance: 5, content: "" };
  $("ed-title").textContent = editing ? "编辑记忆" : "新增记忆";
  $("ed-kind").value = m.kind; $("ed-kind").disabled = !!editing;
  $("ed-scope").value = m.scope; $("ed-scope").disabled = !!editing;
  $("ed-subject").value = m.subject_id || "";
  $("ed-importance").value = m.importance;
  $("ed-day").value = m.day_key || "";
  $("ed-content").value = m.content;
  $("ed-meta").textContent = editing ? `ID ${m.id} · 创建 ${fmtTs(m.created_at)} · 更新 ${fmtTs(m.updated_at)} · 来源会话 ${m.conversation_id || "-"}` : "";
  $("ed-delete").classList.toggle("hidden", !editing);
  $("editor").showModal();
}

async function saveEditor() {
  const body = {
    content: $("ed-content").value, importance: Number($("ed-importance").value),
    subject_id: $("ed-subject").value.trim() || null, day_key: $("ed-day").value.trim() || null,
  };
  if (editing) await api("/api/memory/" + encodeURIComponent(editing.id), { method: "PUT", body: JSON.stringify(body) });
  else await api("/api/memory", { method: "POST", body: JSON.stringify({ ...body, kind: $("ed-kind").value, scope: $("ed-scope").value.trim() }) });
  $("editor").close(); loadMemories();
}

async function deleteEditor() {
  if (!editing || !confirm("确定删除这条记忆？")) return;
  await api("/api/memory/" + encodeURIComponent(editing.id), { method: "DELETE" });
  $("editor").close(); loadMemories();
}

async function loadConversations() {
  const rows = await api("/api/conversations");
  $("conv-table").innerHTML = "<tr><th>会话</th><th>作用域</th><th>消息数</th><th>最近消息</th></tr>" + rows.map((c) =>
    `<tr data-id="${esc(c.id)}" style="cursor:pointer"><td>${esc(c.id)} ${c.title ? "· " + esc(c.title) : ""}</td><td>${esc(scopeLabel(c.scope))}</td><td>${c.message_count}</td><td>${fmtTs(c.last_message_at)}</td></tr>`).join("");
  $("conv-table").querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = () => loadMessages(tr.dataset.id));
}

async function loadMessages(id) {
  const messages = await api(`/api/conversations/${encodeURIComponent(id)}/messages?limit=200`);
  $("conv-title").textContent = `${id} · 最近 ${messages.length} 条（新的在上）`;
  $("conv-messages").innerHTML = messages.map((m) =>
    `<div class="msg role-${m.role}"><span class="muted">${fmtTs(m.ts)} · ${m.role === "assistant" ? "碧波" : esc(m.actor_name || m.actor_id)}${m.episode_id ? " · 已整合" : ""}</span>\n${esc(m.content)}</div>`).join("");
}

async function loadState() {
  $("state-json").textContent = JSON.stringify(await api("/api/state/owner"), null, 2);
}

function switchTab(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll("main > section").forEach((s) => s.classList.toggle("hidden", s.id !== "tab-" + tab));
  ({ memories: loadMemories, conversations: loadConversations, state: loadState, overview: loadStats })[tab]().catch(alertError);
}
const alertError = (e) => alert("操作失败：" + e.message);

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => switchTab(b.dataset.tab));
$("btn-search").onclick = () => { offset = 0; loadMemories().catch(alertError); };
$("f-keyword").onkeydown = (e) => { if (e.key === "Enter") $("btn-search").click(); };
$("btn-prev").onclick = () => { offset = Math.max(0, offset - PAGE); loadMemories().catch(alertError); };
$("btn-next").onclick = () => { offset += PAGE; loadMemories().catch(alertError); };
$("btn-new").onclick = () => openEditor(null).catch(alertError);
$("ed-save").onclick = () => saveEditor().catch(alertError);
$("ed-delete").onclick = () => deleteEditor().catch(alertError);
$("ed-cancel").onclick = () => $("editor").close();
$("btn-export").onclick = () => { window.location = "/api/export"; };
$("btn-rebuild").onclick = async () => {
  if (!confirm("将清空向量索引并从 SQLite 全量重建，期间检索可能变慢。继续？")) return;
  $("overview-msg").textContent = "重建中…";
  try { $("overview-msg").textContent = "完成：" + JSON.stringify(await api("/api/rebuild_index", { method: "POST" })); loadStats(); }
  catch (e) { $("overview-msg").textContent = ""; alertError(e); }
};

loadStats().then(loadMemories).catch(alertError);
</script>
</body>
</html>
